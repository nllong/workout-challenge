<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Daily: small wins, happy days</title>
<desc id="desc">A pink and lavender banner with the app's smiling workout buddy.</desc>
